<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAE GÜVENLİK - Siber Kalkan Önizlemesi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #030811;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            background: radial-gradient(circle at center, #061122 0%, #020408 100%);
        }

        #ui-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(3, 11, 24, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 160, 170, 0.1);
            border-radius: 50%;
            width: 220px;
            height: 220px;
            box-shadow: 0 0 30px rgba(150, 160, 170, 0.05) inset;
            transition: all 0.5s ease;
        }

        .title {
            color: #a0aab4;
            font-size: 28px;
            margin: 0;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(150, 160, 170, 0.5);
            transition: color 0.5s;
        }

        .subtitle {
            color: #4a8b99;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 5px;
            transition: color 0.5s;
        }

        .progress {
            color: #ffffff;
            font-size: 42px;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        button {
            background: rgba(150, 160, 170, 0.1);
            border: 1px solid #a0aab4;
            color: #a0aab4;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(150, 160, 170, 0.2) inset;
        }

        button:hover {
            background: rgba(150, 160, 170, 0.3);
            box-shadow: 0 0 20px rgba(150, 160, 170, 0.5) inset;
        }

        button.alert-btn {
            border-color: #ff3333;
            color: #ff3333;
            background: rgba(255, 51, 51, 0.1);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.2) inset;
        }
        button.alert-btn:hover {
            background: rgba(255, 51, 51, 0.3);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.5) inset;
        }

        /* Threat Mode Styles */
        body.threat-mode .title { color: #ff3333; text-shadow: 0 0 15px rgba(255, 51, 51, 0.8); }
        body.threat-mode .subtitle { color: #cc2222; }
        body.threat-mode #hud { border-color: rgba(255, 51, 51, 0.3); box-shadow: 0 0 40px rgba(255, 51, 51, 0.15) inset; }

        .dev-badge {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <canvas id="globeCanvas" width="500" height="500"></canvas>
        <div id="hud">
            <h2 class="title">AAE</h2>
            <div class="subtitle">GÜVENLİK</div>
            <div class="progress" id="progressVal">0%</div>
        </div>
    </div>

    <div class="controls">
        <button id="scanBtn">Taramayı Başlat</button>
        <button id="threatBtn" class="alert-btn">Tehdit Simülasyonu</button>
    </div>

    <div class="dev-badge">Geliştirici: Abdullah Asım Ersin</div>

    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        const progressEl = document.getElementById('progressVal');
        const scanBtn = document.getElementById('scanBtn');
        const threatBtn = document.getElementById('threatBtn');
        
        const width = canvas.width;
        const height = canvas.height;
        const cx = width / 2;
        const cy = height / 2;
        const radius = 200;
        
        let rotation = 0;
        let radarAngle = 0;
        
        // State
        let state = 'IDLE'; // IDLE, SCANNING, SAFE, THREAT
        let scanProgress = 0;
        let scanSlicePhase = -1.0;
        let shieldPhase = 0;
        let alertPulse = 0;
        
        // Theme Colors (Dark Theme - No Blue/Cyan)
        const THEME = {
            SAFE: { primary: 'rgba(140, 150, 160, ', secondary: 'rgba(200, 210, 220, ' },
            THREAT: { primary: 'rgba(255, 51, 51, ', secondary: 'rgba(255, 100, 100, ' }
        };
        
        // Random dots (Nodes)
        const nodes = [];
        for(let i=0; i<30; i++) { // Less stars per request
            nodes.push({
                lat: (Math.random() - 0.5) * Math.PI,
                lon: Math.random() * Math.PI * 2,
                size: Math.random() * 2 + 0.5 // Smaller, more subtle stars
            });
        }

        // ================= AUDIO ENGINE =================
        const scanAudio = new Audio('scanner.mp3');
        scanAudio.loop = true;
        const threatAudio = new Audio('virus.mp3');
        threatAudio.loop = true;

        function playScanSound() {
            threatAudio.pause();
            threatAudio.currentTime = 0;
            scanAudio.play().catch(e => console.log("Audio play prevented", e));
        }

        function playThreatSound() {
            scanAudio.pause();
            scanAudio.currentTime = 0;
            threatAudio.play().catch(e => console.log("Audio play prevented", e));
        }

        function stopSound() {
            scanAudio.pause();
            scanAudio.currentTime = 0;
            threatAudio.pause();
            threatAudio.currentTime = 0;
        }

        // ================= INTERACTIONS =================

        scanBtn.addEventListener('click', () => {
            if (state === 'IDLE' || state === 'SAFE' || state === 'THREAT') {
                state = 'SCANNING';
                scanProgress = 0;
                scanSlicePhase = -1.0;
                shieldPhase = 0;
                scanBtn.innerText = "Taramayı Durdur";
                document.body.classList.remove('threat-mode');
                playScanSound();
            } else {
                state = 'SAFE'; // Güvenli tamamlanma
                scanBtn.innerText = "Taramayı Başlat";
                stopSound();
            }
        });

        threatBtn.addEventListener('click', () => {
            if (state === 'THREAT') {
                state = 'SAFE';
                document.body.classList.remove('threat-mode');
                stopSound();
            } else {
                state = 'THREAT';
                scanProgress = 1.0;
                shieldPhase = 0;
                scanBtn.innerText = "Taramayı Başlat";
                document.body.classList.add('threat-mode');
                playThreatSound();
            }
        });

        // ================= DRAW LOOP =================
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            const isThreat = state === 'THREAT';
            const colors = isThreat ? THEME.THREAT : THEME.SAFE;

            // 1. Dış Halo (Glow)
            const glowGradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.3);
            glowGradient.addColorStop(0, colors.primary + (state === 'SCANNING' ? '0.2)' : '0.1)'));
            glowGradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, width, height);

            // Tehdit Pulsasyonu
            if (isThreat) {
                alertPulse = (Math.sin(Date.now() / 150) + 1) / 2; // Hızlı atım
                ctx.beginPath();
                ctx.arc(cx, cy, radius * (1 + alertPulse * 0.15), 0, Math.PI*2);
                ctx.strokeStyle = colors.primary + (0.3 * (1 - alertPulse)) + ')';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // 2. Küre Grid
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(50, 60, 70, 0.4)'; // Darker rings

            // Enlemler (Latitudes)
            for (let i = -3; i <= 3; i++) {
                const latOffset = (i / 4) * radius;
                const r = Math.sqrt(Math.max(0, radius*radius - latOffset*latOffset));
                const ellipseHeight = r * 0.25;
                ctx.beginPath();
                ctx.ellipse(cx, cy + latOffset, r, ellipseHeight, 0, 0, Math.PI*2);
                ctx.stroke();
            }

            // Boylamlar (Longitudes)
            const numLong = 10;
            for (let i = 0; i < numLong; i++) {
                const angle = (i / numLong) * Math.PI * 2 + rotation;
                ctx.beginPath();
                for (let a = -Math.PI/2; a <= Math.PI/2; a += 0.1) {
                    const rBase = Math.cos(a) * radius;
                    const y = cy + Math.sin(a) * radius;
                    const x = cx + rBase * Math.cos(angle);
                    if (a === -Math.PI/2) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // 3. Siber Düğümler (Nodes)
            nodes.forEach(node => {
                const rotatedLon = node.lon + rotation;
                const z = Math.cos(node.lat) * Math.sin(rotatedLon);
                if (z > -0.2) { // Sadece ön yüzdekileri çiz (biraz derinlik payı ile)
                    const x = cx + Math.cos(node.lat) * Math.cos(rotatedLon) * radius;
                    const y = cy + Math.sin(node.lat) * radius;
                    
                    const depthAlpha = z > 0 ? z : 0.1;
                    
                    // Main star body
                    const starSize = node.size * (1 + depthAlpha);
                    ctx.beginPath();
                    ctx.moveTo(x, y - starSize);
                    ctx.lineTo(x + starSize * 0.2, y - starSize * 0.2);
                    ctx.lineTo(x + starSize, y);
                    ctx.lineTo(x + starSize * 0.2, y + starSize * 0.2);
                    ctx.lineTo(x, y + starSize);
                    ctx.lineTo(x - starSize * 0.2, y + starSize * 0.2);
                    ctx.lineTo(x - starSize, y);
                    ctx.lineTo(x - starSize * 0.2, y - starSize * 0.2);
                    ctx.closePath();
                    ctx.fillStyle = colors.primary + (0.9 * depthAlpha + 0.1) + ')';
                    ctx.fill();
                    
                    // Star glow (optional, we can keep it as a subtle circle or another star)
                    ctx.beginPath();
                    ctx.arc(x, y, node.size * (1.5 + depthAlpha * 1.5), 0, Math.PI*2);
                    ctx.fillStyle = colors.primary + (0.2 * depthAlpha) + ')';
                    ctx.fill();
                    
                    // Bağlantı çizgileri (Hafifçe)
                    if (Math.random() > 0.90 && state === 'SCANNING') { // Increased line frequency
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(cx, cy);
                        ctx.strokeStyle = colors.primary + '0.5)';
                        ctx.stroke();
                    }
                }
            });

            // 4. Tarama (Scanning) Efektleri
            if (state === 'SCANNING') {
                // Yüzde güncellenmesi
                scanProgress += 0.005;
                if (scanProgress > 1.0) {
                    scanProgress = 1.0;
                    state = 'SAFE'; // Otomatik bitiş
                    scanBtn.innerText = "Taramayı Başlat";
                    stopSound();
                }
                
                // Lazer Dilimi (Scanner Slice)
                scanSlicePhase += 0.02;
                if (scanSlicePhase > 1.1) scanSlicePhase = -1.1;
                
                const sliceYOffset = radius * scanSlicePhase;
                if (Math.abs(sliceYOffset) < radius) {
                    const sliceRadius = Math.sqrt(radius*radius - sliceYOffset*sliceYOffset);
                    const sliceHeight = sliceRadius * 0.25;
                    
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + sliceYOffset, sliceRadius, sliceHeight, 0, 0, Math.PI*2);
                    ctx.strokeStyle = colors.primary + '0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    ctx.fillStyle = colors.primary + '0.2)';
                    ctx.fill();
                }

                progressEl.innerText = Math.floor(scanProgress * 100) + '%';
            } else if (state === 'SAFE') {
                progressEl.innerText = '100%';
                
                // 5. Kalkan Birleşme Animasyonu (Shield Assembly)
                shieldPhase += 0.02;
                if (shieldPhase > 1) shieldPhase = 1;
                
                const hexCount = 6;
                for (let i = 0; i < hexCount; i++) {
                    const angle = (i * Math.PI * 2) / hexCount + (1 - shieldPhase) * Math.PI;
                    const dist = radius * 1.5 * (1 - shieldPhase);
                    
                    const hx = cx + Math.cos(angle) * dist;
                    const hy = cy + Math.sin(angle) * dist;
                    
                    // Altıgenleri (Kalkan parçaları) çiz
                    ctx.beginPath();
                    ctx.arc(hx, hy, 15 * shieldPhase, 0, Math.PI*2); // Basitlik için daire
                    ctx.strokeStyle = colors.primary + (0.7 * shieldPhase) + ')';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    if (shieldPhase === 1) {
                        // Kalkan kilitlendi çizgileri
                        ctx.beginPath();
                        ctx.moveTo(hx, hy);
                        const nextAngle = ((i+1) * Math.PI * 2) / hexCount;
                        ctx.lineTo(cx + Math.cos(nextAngle)*dist, cy + Math.sin(nextAngle)*dist);
                        ctx.strokeStyle = colors.secondary + '0.3)';
                        ctx.stroke();
                    }
                }
            } else if (state === 'THREAT') {
                progressEl.innerText = 'RİSK!';
            } else {
                progressEl.innerText = '0%';
                if(shieldPhase > 0) shieldPhase -= 0.05; // Geri çekilme
            }

            rotation += 0.003;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
